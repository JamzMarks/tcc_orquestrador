services:
  injector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orquestrador
    environment:
      - PORT=${PORT}
      - AMQP_URL=${AMQP_URL}
      - QUEUE_NAME=${QUEUE_NAME}
      - GRAPH_DB_URI=${GRAPH_DB_URI}
      - GRAPH_DB_USERNAME=${GRAPH_DB_USERNAME}
      - GRAPH_DB_PASSWORD=${GRAPH_DB_PASSWORD}
      - IOT_HUB_HOST=${IOT_HUB_HOST}
      - AZURE_IOTHUB_CONNECTION_STRING=${AZURE_IOTHUB_CONNECTION_STRING}
    ports:
      - "${PORT}:${PORT}"
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_VHOST: "/"
      RABBITMQ_LOAD_DEFINITIONS: "/etc/rabbitmq/definitions.json"
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "admin123"
    volumes:
      - ./definitions.json:/etc/rabbitmq/definitions.json
